services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kkb_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kkb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kkb_password}
      POSTGRES_DB: ${POSTGRES_DB:-kkb_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/database_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      # Friend's init.sql (loads after schema)
      - ./procurement_bans/init.sql:/docker-entrypoint-initdb.d/02_init.sql:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kkb_user} -d ${POSTGRES_DB:-kkb_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kkb_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Friend's Python Application (ihale-app)
  ihale-app:
    build: ./procurement_bans
    image: ihale-projesi:v2
    container_name: ihale_container_final
    depends_on:
      postgres:
        condition: service_healthy
    # GPU Support (if available)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tty: true
    stdin_open: true
    volumes:
      - ./procurement_bans:/workspace
    environment:
      # Connect to the postgres service above
      - DB_HOST=postgres
      - DB_NAME=${POSTGRES_DB:-kkb_db}
      - DB_USER=${POSTGRES_USER:-kkb_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-kkb_password}
      # LLM settings (API_KEY, BASE_URL, MODEL) come from procurement_bans/.env, mounted at /workspace/.env

  # News Scanning and Sentiment Analysis
  news-scanner:
    build: ./news_sentiment
    image: news-scanner:latest
    container_name: news_scanner_app
    depends_on:
      postgres:
        condition: service_healthy
    tty: true
    stdin_open: true
    volumes:
      - ./news_sentiment:/app
      - ./report:/app/report
    environment:
      # OpenAI API
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - OPENAI_MODEL=${OPENAI_MODEL}
      # Database connection
      - DB_HOST=postgres
      - DB_NAME=${POSTGRES_DB:-kkb_db}
      - DB_USER=${POSTGRES_USER:-kkb_user}
      - DB_PASS=${POSTGRES_PASSWORD:-kkb_password}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kkb_user}:${POSTGRES_PASSWORD:-kkb_password}@postgres:5432/${POSTGRES_DB:-kkb_db}

volumes:
  postgres_data:
  pgadmin_data:
