services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kkb_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kkb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kkb_password}
      POSTGRES_DB: ${POSTGRES_DB:-kkb_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/database_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kkb_user} -d ${POSTGRES_DB:-kkb_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kkb_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@kkb.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
