
<!DOCTYPE html>
<html>
<head>
    <style>
        @page { size: A4; margin: 2cm; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #0f172a; 
            line-height: 1.5;
            max-width: 900px;
            margin: 0 auto;
        }

        .header { border-bottom: 2px solid #e2e8f0; padding-bottom: 1rem; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin: 0; }
        .header p { color: #64748b; margin-top: 5px; }

        /* --- CARD STYLES --- */
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
            background: white;
            break-inside: avoid;
            overflow: hidden;
        }
        .card-header { background: #f8fafc; padding: 1rem 1.5rem; border-bottom: 1px solid #e2e8f0; }
        .card-content { padding: 1.5rem; }

        /* --- TYPOGRAPHY --- */
        .title { font-weight: 600; font-size: 1.125rem; margin: 0; color: #1e293b; }
        .subtitle { font-size: 0.875rem; color: #64748b; margin-top: 2px; }
        .text-body { font-size: 0.9rem; color: #334155; text-align: justify; }

        /* --- BADGES --- */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid transparent;
        }
        .badge-default { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
        
        /* SENTIMENT COLORS */
        .badge-positive { background: #dcfce7; color: #166534; border-color: #86efac; } /* Green */
        .badge-negative { background: #fee2e2; color: #991b1b; border-color: #fca5a5; } /* Red */
        .badge-neutral { background: #f3f4f6; color: #374151; border-color: #d1d5db; } /* Gray */

        /* --- TABLES (For Gazette) --- */
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.5rem; }
        th { text-align: left; padding: 0.75rem; background-color: #f1f5f9; color: #475569; font-weight: 600; }
        td { padding: 0.75rem; border-bottom: 1px solid #e2e8f0; vertical-align: top; }

        /* --- UTILS --- */
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .icon { margin-right: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="flex-between">
            <h1>FinGuard Intelligence Report</h1>
            <span class="badge badge-default">CONFIDENTIAL</span>
        </div>
        <p>Combined analysis of Trade Registry Data and News Sentiment</p>
    </div>

    

</body>
</html>
